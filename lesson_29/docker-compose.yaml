version: '3.9'

services:
  pg_db:
    image: postgres:15
    environment:
      POSTGRES_USER: docker_user
      POSTGRES_PASSWORD: docker_password
      POSTGRES_DB: docker_test_db
    command: postgres -c listen_addresses='*' -c port=5432
  app:
    build:
      context: .
    depends_on:
      - pg_db
    environment:
      DB_HOST: pg_db
      DB_PORT: 5432
      DB_NAME: docker_test_db
      DB_USER: docker_user
      DB_PASSWORD: docker_password